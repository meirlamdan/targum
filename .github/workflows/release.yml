name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os: win
          - platform: macos-latest
            os: mac

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install tinyjs (Windows)
        if: matrix.os == 'win'
        shell: pwsh
        run: |
          irm https://tinyjs.app/install.ps1 | iex
          "$env:LOCALAPPDATA\tinyjs" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install tinyjs (macOS)
        if: matrix.os == 'mac'
        run: |
          curl -fsSL https://tinyjs.app/install | sh
          echo "$HOME/.tinyjs" >> "$GITHUB_PATH"

      # Builds the app, packs it, and writes a per-OS manifest.json
      - name: Build and pack
        run: tinyjs publish

      - uses: actions/upload-artifact@v4
        with:
          name: publish-${{ matrix.os }}
          path: dist/publish/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      # One manifest for every OS: macOS owns url/sha256, Windows the "win" block
      - name: Merge update manifests
        run: |
          jq -s '.[0] * .[1]' publish-mac/manifest.json publish-win/manifest.json > manifest.json
          cat manifest.json

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          ## Download

          | Platform | File |
          |----------|------|
          | Windows 10/11 | \`targum-${VERSION}-win.zip\` — unzip and run \`targum.exe\` |
          | macOS 14+ | \`targum-${VERSION}.zip\` — unzip and move \`Targum.app\` to Applications |
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Targum $GITHUB_REF_NAME" \
            --notes-file notes.md \
            publish-win/*.zip publish-mac/*.zip manifest.json
