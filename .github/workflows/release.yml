name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Targum ${{ github.ref_name }}'
          releaseBody: |
            ## Download

            Choose the file for your operating system below.

            - **Windows**: `_x64-setup.exe`
            - **macOS (Apple Silicon)**: `_aarch64.dmg`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Save Windows sig
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $sig = Get-ChildItem -Recurse "src-tauri\target" -Filter "*.exe.sig" | Select-Object -First 1
          if (-not $sig) { Write-Error "No .exe.sig found"; exit 1 }
          Write-Host "Found: $($sig.FullName)"
          Copy-Item $sig.FullName "win-sig.txt"

      - name: Upload Windows sig
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-sig
          path: win-sig.txt

      - name: Save macOS sig
        if: matrix.platform == 'macos-latest'
        run: |
          sig=$(find src-tauri/target -name "*.app.tar.gz.sig" | head -1)
          if [ -z "$sig" ]; then echo "No .app.tar.gz.sig found"; exit 1; fi
          echo "Found: $sig"
          cp "$sig" macos-sig.txt

      - name: Upload macOS sig
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-sig
          path: macos-sig.txt

  updater-json:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signatures
        uses: actions/download-artifact@v4

      - name: Generate and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"

          WIN_SIG=$(cat windows-sig/win-sig.txt)
          MAC_SIG=$(cat macos-sig/macos-sig.txt)

          WIN_URL=$(gh release view "${TAG}" --repo meirlamdan/targum --json assets \
            --jq '.assets[] | select(.name | endswith(".exe")) | .browserDownloadUrl' | head -1)
          MAC_URL=$(gh release view "${TAG}" --repo meirlamdan/targum --json assets \
            --jq '.assets[] | select(.name | endswith(".app.tar.gz")) | .browserDownloadUrl' | head -1)

          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "${WIN_SIG}",
                "url": "${WIN_URL}"
              },
              "darwin-aarch64": {
                "signature": "${MAC_SIG}",
                "url": "${MAC_URL}"
              }
            }
          }
          EOF

          cat latest.json
          gh release upload "${TAG}" latest.json --clobber --repo meirlamdan/targum
