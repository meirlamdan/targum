name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Targum ${{ github.ref_name }}'
          releaseBody: |
            ## Download

            Choose the file for your operating system below.

            - **Windows**: `_x64-setup.exe`
            - **macOS (Apple Silicon)**: `_aarch64.dmg`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Save Windows sig
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $nsisDir = "src-tauri\target\release\bundle\nsis"
          Write-Host "Listing $nsisDir :"
          if (Test-Path $nsisDir) {
            Get-ChildItem $nsisDir | ForEach-Object { Write-Host "  $($_.Name)" }
          } else {
            Write-Host "  [directory not found]"
          }
          $sig = Get-ChildItem $nsisDir -ErrorAction SilentlyContinue |
                 Where-Object { $_.Name -match '\.exe\.sig$' } |
                 Select-Object -First 1
          if (-not $sig) { Write-Error "No .exe.sig file found"; exit 1 }
          Copy-Item $sig.FullName "win-sig.txt"
          Write-Host "Saved: $($sig.Name)"

      - name: Upload Windows sig
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-sig
          path: win-sig.txt

      - name: Save macOS sig
        if: matrix.platform == 'macos-latest'
        run: |
          macDir="src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
          echo "Listing $macDir :"
          ls -la "$macDir" 2>/dev/null || echo "  [directory not found]"
          sig=$(find "$macDir" -maxdepth 1 -name "*.sig" 2>/dev/null | head -1)
          if [ -z "$sig" ]; then
            echo "No .sig found. Broader search:"
            find src-tauri/target -name "*.sig" 2>/dev/null
            exit 1
          fi
          cp "$sig" macos-sig.txt
          echo "Saved: $sig"

      - name: Upload macOS sig
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-sig
          path: macos-sig.txt

  updater-json:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download sig artifacts
        uses: actions/download-artifact@v4

      - name: Generate and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"

          WIN_SIG=$(cat windows-sig/win-sig.txt)
          MAC_SIG=$(cat macos-sig/macos-sig.txt)

          WIN_URL=$(gh release view "${TAG}" --repo meirlamdan/targum --json assets \
            --jq '.assets[] | select(.name | endswith(".exe")) | .browserDownloadUrl' | head -1)
          MAC_URL=$(gh release view "${TAG}" --repo meirlamdan/targum --json assets \
            --jq '.assets[] | select(.name | endswith(".app.tar.gz")) | .browserDownloadUrl' | head -1)

          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg win_sig "$WIN_SIG" \
            --arg win_url "$WIN_URL" \
            --arg mac_sig "$MAC_SIG" \
            --arg mac_url "$MAC_URL" \
            '{
              version: $version,
              notes: "",
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": {signature: $win_sig, url: $win_url},
                "darwin-aarch64": {signature: $mac_sig, url: $mac_url}
              }
            }' > latest.json

          cat latest.json
          gh release upload "${TAG}" latest.json --clobber --repo meirlamdan/targum
