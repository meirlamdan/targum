name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Targum ${{ github.ref_name }}'
          releaseBody: |
            ## Download

            Choose the file for your operating system below.

            - **Windows**: `_x64-setup.exe`
            - **macOS (Apple Silicon)**: `_aarch64.dmg`
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: 'false'
          args: ${{ matrix.args }}

  updater-json:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download sig files from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p sigs
          gh release download "${{ github.ref_name }}" \
            --repo meirlamdan/targum \
            --pattern "*.exe.sig" \
            --dir sigs
          gh release download "${{ github.ref_name }}" \
            --repo meirlamdan/targum \
            --pattern "*.app.tar.gz.sig" \
            --dir sigs

      - name: Generate and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"

          WIN_SIG=$(cat sigs/*.exe.sig)
          MAC_SIG=$(cat sigs/*.app.tar.gz.sig)

          WIN_URL=$(gh release view "${TAG}" --repo meirlamdan/targum --json assets \
            --jq '.assets[] | select(.name | endswith(".exe")) | .browserDownloadUrl' | head -1)
          MAC_URL=$(gh release view "${TAG}" --repo meirlamdan/targum --json assets \
            --jq '.assets[] | select(.name | endswith(".app.tar.gz")) | .browserDownloadUrl' | head -1)

          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg win_sig "$WIN_SIG" \
            --arg win_url "$WIN_URL" \
            --arg mac_sig "$MAC_SIG" \
            --arg mac_url "$MAC_URL" \
            '{
              version: $version,
              notes: "",
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": {signature: $win_sig, url: $win_url},
                "darwin-aarch64": {signature: $mac_sig, url: $mac_url}
              }
            }' > latest.json

          cat latest.json
          gh release upload "${TAG}" latest.json --clobber --repo meirlamdan/targum
