name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Targum ${{ github.ref_name }}'
          releaseBody: |
            ## Download

            Choose the file for your operating system below.

            - **Windows**: `_x64-setup.exe`
            - **macOS (Apple Silicon)**: `_aarch64.dmg`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Windows sig
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-sig
          path: src-tauri/target/release/bundle/nsis/*.exe.sig

      - name: Upload macOS sig
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-sig
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  updater-json:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signatures
        uses: actions/download-artifact@v4

      - name: Generate and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          BASE="https://github.com/meirlamdan/targum/releases/download/${TAG}"

          WIN_SIG=$(cat windows-sig/*.exe.sig)
          WIN_FILE=$(basename windows-sig/*.exe.sig .sig)
          MAC_SIG=$(cat macos-sig/*.app.tar.gz.sig)
          MAC_FILE=$(basename macos-sig/*.app.tar.gz.sig .sig)

          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "${WIN_SIG}",
                "url": "${BASE}/${WIN_FILE}"
              },
              "darwin-aarch64": {
                "signature": "${MAC_SIG}",
                "url": "${BASE}/${MAC_FILE}"
              }
            }
          }
          EOF

          gh release upload "${TAG}" latest.json --clobber
