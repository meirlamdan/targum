name: Update Pages Version

on:
  release:
    types: [published]

jobs:
  update-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Bump version in landing page
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          sed -i "s|<span id=\"release-version\">[^<]*</span>|<span id=\"release-version\">${VERSION}</span>|" index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "chore: bump pages version to ${VERSION}"
          git push
