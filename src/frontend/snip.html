<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Targum</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; cursor: crosshair; user-select: none; }
    /* the screen as it was when the shortcut was pressed */
    #shot { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: fill; pointer-events: none; }
    /* dims everything; the selection cuts a clear hole with its shadow */
    #dim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.35); pointer-events: none; }
    #sel {
      position: fixed; display: none; pointer-events: none;
      border: 1.5px solid #0a84ff;
      box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.35);
    }
    body.selecting #dim { display: none; }
    body.selecting #sel { display: block; }
    #hint {
      position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
      padding: 8px 16px; border-radius: 8px;
      background: rgba(28, 28, 30, 0.85); color: #fff;
      font: 14px -apple-system, 'Segoe UI', system-ui, sans-serif;
      pointer-events: none; white-space: nowrap;
    }
    body.selecting #hint { display: none; }
  </style>
</head>
<body>
  <img id="shot" alt="">
  <div id="dim"></div>
  <div id="sel"></div>
  <div id="hint"></div>
  <script type="module">
    import { MESSAGES } from './i18n.js';

    const sel = document.getElementById('sel');
    let start = null;
    let finished = false;

    const locale = (await tiny.store.get('appLocale').catch(() => null)) ?? navigator.language.split('-')[0];
    const hint = document.getElementById('hint');
    hint.textContent = (MESSAGES[locale] ?? MESSAGES.en).snipHint ?? MESSAGES.en.snipHint;
    hint.dir = ['he', 'ar', 'fa'].includes(locale) ? 'rtl' : 'ltr';

    const info = await tiny.api.call('snipInfo');
    if (!info) finish(null);
    else document.getElementById('shot').src = tiny.fileURL(info.path);
    window.focus();

    function finish(rect) {
      if (finished) return;
      finished = true;
      tiny.api.call('snipDone', { rect });
    }

    function box(e) {
      const x = Math.min(start.x, e.clientX), y = Math.min(start.y, e.clientY);
      return { x, y, width: Math.abs(e.clientX - start.x), height: Math.abs(e.clientY - start.y) };
    }

    addEventListener('mousedown', (e) => {
      if (e.button !== 0) { finish(null); return; } // right click cancels
      start = { x: e.clientX, y: e.clientY };
      document.body.classList.add('selecting');
      Object.assign(sel.style, { left: start.x + 'px', top: start.y + 'px', width: '0', height: '0' });
    });

    addEventListener('mousemove', (e) => {
      if (!start) return;
      const b = box(e);
      Object.assign(sel.style, { left: b.x + 'px', top: b.y + 'px', width: b.width + 'px', height: b.height + 'px' });
    });

    addEventListener('mouseup', (e) => {
      if (!start) return;
      const b = box(e);
      start = null;
      if (b.width < 5 || b.height < 5) { // a click, not a drag
        document.body.classList.remove('selecting');
        return;
      }
      finish({ x: b.x / innerWidth, y: b.y / innerHeight, width: b.width / innerWidth, height: b.height / innerHeight });
    });

    addEventListener('keydown', (e) => { if (e.key === 'Escape') finish(null); });
    addEventListener('contextmenu', (e) => e.preventDefault());
  </script>
</body>
</html>
